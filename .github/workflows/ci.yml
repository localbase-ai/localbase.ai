# Runs on every pull request and every push to main. All four jobs must pass;
# the main branch ruleset can require them before a PR merges.
#
# Third-party actions are pinned to a full commit SHA, and downloaded tools are
# checked against their published SHA-256 sums, so a moved tag or a swapped
# release asset can't change what runs here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + attack suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install (exact lockfiles)
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix app
      - name: Unit + API tests
        run: npm test
      - name: Build the app
        run: npx vite build
        working-directory: app
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Live attack suite (real API + dev server + browser)
        run: node scripts/attack-test.mjs
      - name: Preview browser smoke test
        run: node scripts/browser-smoke.js

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner .

  dependencies:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSION: 2.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -fsSLO "$base/osv-scanner_linux_amd64"
          curl -fsSL "$base/osv-scanner_SHA256SUMS" | grep " osv-scanner_linux_amd64\$" | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
      - name: Scan every lockfile
        # Accepted advisories live in osv-scanner.toml, each with a reason and
        # an expiry date. Anything else fails the build.
        run: ./osv-scanner_linux_amd64 scan -r --config osv-scanner.toml .

  code:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan (fails on ERROR-severity findings)
        run: >-
          semgrep scan
          --config p/javascript --config p/nodejs --config p/expressjs
          --config p/react --config p/secrets --config p/owasp-top-ten
          --severity ERROR --error --metrics=off
          --exclude node_modules --exclude app/node_modules --exclude app/dist
          .
