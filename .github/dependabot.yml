version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new version: most poisoned releases are
    # caught and pulled within days of publishing.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new version: most poisoned releases are
    # caught and pulled within days of publishing.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
